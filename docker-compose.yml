services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - atelier-network

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    networks:
      - atelier-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

networks:
  atelier-network:
    driver: bridge

volumes:
  redis-data: