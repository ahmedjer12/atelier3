services:
  app-blue:
    build: .
    image: ${APP_IMAGE:-atelier3-app:local}
    profiles:
      - blue
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DEPLOY_COLOR: blue
      APP_VERSION: ${APP_VERSION:-1.0.0}
      GIT_SHA: ${GIT_SHA:-local}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - atelier-network

  app-green:
    build: .
    image: ${APP_IMAGE:-atelier3-app:local}
    profiles:
      - green
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DEPLOY_COLOR: green
      APP_VERSION: ${APP_VERSION:-1.0.0}
      GIT_SHA: ${GIT_SHA:-local}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - atelier-network

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    networks:
      - atelier-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  nginx:
    image: nginx:alpine
    ports:
      - "5000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app-green
    networks:
      - atelier-network

networks:
  atelier-network:
    driver: bridge

volumes:
  redis-data: