name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python environment
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.12"

      - name: Run flake8
        run: python -m flake8 app.py test_app.py

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      REDIS_HOST: localhost
      REDIS_PORT: 6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python environment
        uses: ./.github/actions/setup-python
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests with coverage and JUnit report
        run: >
          python -m pytest -v
          --cov=app
          --cov-report=xml:coverage.xml
          --junitxml=junit.xml

      - name: Upload test reports
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-python-${{ matrix.python-version }}
          path: |
            coverage.xml
            junit.xml

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - lint
      - test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t atelier3-ci:${{ github.sha }} .

  ci-ok:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - lint
      - test
      - build

    steps:
      - name: CI succeeded
        run: echo "All CI jobs passed successfully"
